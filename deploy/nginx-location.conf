# Place these locations inside the ckflorist.my server block.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~* \.(?:css|js|jpg|jpeg|png|webp|avif|svg|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Prevent direct web access to application internals.
location ~ ^/(?:app|config|database|docs|storage|tests|deploy|scripts)/ {
    return 404;
}

